# The environment definition, piped to `ant beta:environments create`. A
# self-hosted environment has no sandbox template: it is a work queue that
# your own poller (start.sh) claims sessions from. ./agents/setup.sh writes
# its ID to .env as CLAUDE_ENVIRONMENT_ID. Mint the environment key for it in
# the Console and put it in .env as ANTHROPIC_ENVIRONMENT_KEY.
name: quickstart-archil-env
metadata:
  quickstart: archil
config:
  type: self_hosted
