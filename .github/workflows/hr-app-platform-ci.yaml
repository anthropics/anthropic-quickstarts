name: hr-app-platform-ci
on:
  pull_request:
    paths:
      - hr-app/platform/**
  push:
    branches:
      - main
    paths:
      - hr-app/platform/**
jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-app/platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrcore
          POSTGRES_PASSWORD: hrcore_dev
          POSTGRES_DB: hrcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hrcore:hrcore_dev@localhost:5432/hrcore
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
